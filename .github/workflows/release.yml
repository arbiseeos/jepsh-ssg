name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # create the version PR and tags
  pull-requests: write # open/update the version PR
  packages: write # publish to GitHub Packages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@arbiseeos"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Create release PR or publish to GitHub Packages
        uses: changesets/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          createGithubReleases: true
          publish: npm run release
          version: npm run version
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package_name="$(node -p \"require('./package.json').name\")"
          package_version="$(node -p \"require('./package.json').version\")"
          npm view "${package_name}@${package_version}" version --registry=https://npm.pkg.github.com >/dev/null

          tag="v${package_version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."
          else
            gh release create "$tag" --title "$tag" --generate-notes --target main
          fi
